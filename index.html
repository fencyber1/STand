<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/stand-logo.webp" />
    <link rel="apple-touch-icon" href="/stand-logo.webp" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="STand - AI-powered exam practice platform with personalized question generation, multiplayer quizzes, and FenBot AI tutor." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STand - AI Exam Practice" />
    <meta property="og:description" content="Practice smarter with AI-generated exam questions, multiplayer quizzes, and an elite AI tutor." />
    <meta property="og:image" content="/stand-logo.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STand - AI Exam Practice" />
    <meta name="twitter:description" content="Practice smarter with AI-generated exam questions, multiplayer quizzes, and an elite AI tutor." />
    <meta name="twitter:image" content="/stand-logo.webp" />
    <title>STand - AI Exam Practice</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://translate.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://integrate.api.nvidia.com" />
    <link rel="dns-prefetch" href="https://*.firebaseio.com" />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1627;transition:opacity .4s ease}
      #splash.hidden{opacity:0;pointer-events:none}
      #splash .logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#6366f1);display:flex;align-items:center;justify-content:center;animation:pulse 1.5s ease-in-out infinite}
      #splash .logo svg{width:44px;height:44px;stroke:#fff;stroke-width:2;fill:none}
      #splash .name{margin-top:20px;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px}
      #splash .spinner{margin-top:16px;width:28px;height:28px;border:3px solid rgba(139,92,246,.3);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="name">STand</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once app is ready
      window.addEventListener('DOMContentLoaded', function() {
        var checkReady = setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(checkReady);
            var splash = document.getElementById('splash');
            if (splash) {
              splash.classList.add('hidden');
              setTimeout(function() { splash.remove(); }, 400);
            }
          }
        }, 50);
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash && !splash.classList.contains('hidden')) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 400);
          }
        }, 8000);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
          navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
